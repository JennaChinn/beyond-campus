<html>
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/conversation-style.css" />
    <title>Messages</title>
    </head>

    <body>
        <header class="fixed-header" role="banner">
            <div class="container-fluid">
              <!-- Site Title  -->
              <div class="site-title col-xs-3">
                <a href="/"><h1>Beyond Campus</h1></a>
              </div>
              <a href="/messages"><div class="message-button">Messages</div></a>
              <a href="/auth/logout"><div class="logout-button">Log out</div></a>
            </div>
          </header>
        </div>

        <div class="cover">
          <div class="prompt-box"></div>
        </div>

        <div class="message-container">
            <button class="profile-button">View Profile</button>
            <ul class="message-list"></ul>
        </div>
        <form id="message-form">
          <input type="text" class="message-box" id="message-box">
          <button type="submit" id="send-button">Send</button>
        </form>

      <script type="module" src="../scripts/conversation.js"></script>
    <body>
</html>
